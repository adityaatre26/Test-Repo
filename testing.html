<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Semantic HTML Example</title>
  </head>
  <body>
    <header>
      <nav>
        <ul>
          <li><a href="/">Home</a></li>
          <li><a href="/about">About</a></li>
          <li><a href="/contact">Contact</a></li>
          <li><a href="/profile">Profile</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <h1>Semantic HTML Structuring</h1>
      <p>
        This page uses semantic elements like &lt;header&gt;, &lt;nav&gt;,
        &lt;main&gt;, and &lt;footer&gt; to create a meaningful document structure.
      </p>
    </main>

    <footer>
      <p>&copy; 2024 Your Website</p>
    </footer>
  </body>
</html>
